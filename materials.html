<script>
(function () {
  var CATEGORY = 'materials';
  var TOPIC_MAP = {
    'materials': { label: 'RAW MATERIALS', title: '原料與價格', desc: '鐵礦砂、焦煤、廢鋼與海運，牽動每一噸鋼的成本。' },
    'mills': { label: 'GLOBAL MILLS', title: '全球鋼廠動態', desc: '台灣、中國、日韓、印度、東南亞與歐美鋼廠的產能、報價與投資布局。' },
    'vehicles': { label: 'ADVANCED VEHICLES', title: '先進載具與鋼材', desc: '無人機、電動車與航太載具的輕量化結構鋼、熱沖壓成形與電磁鋼片技術與市場。' },
    'demand': { label: 'DOWNSTREAM DEMAND', title: '下游需求觀察', desc: 'AI、能源、營建、汽車、造船、家電與機械的景氣變化，從需求端看鋼價走向。' },
    'trade': { label: 'TRADE & POLICY', title: '貿易與政策', desc: '歐盟 CBAM、反傾銷調查、關稅與產能政策的最新動向。' },
    'carbon': { label: 'CARBON NEUTRALITY', title: '碳中和', desc: '碳費、碳權交易、產品碳足跡與鋼廠淨零路徑，掌握碳成本如何改寫鋼鐵競爭力。' },
    'decarb': { label: 'DECARBONIZATION', title: '低碳冶金', desc: '氫氣直接還原、電爐轉型與碳捕捉，鋼鐵業邁向淨零的關鍵路徑。' },
    'steel101': { label: 'STEEL 101', title: '鋼鐵小學堂', desc: '從高爐、轉爐、連鑄到熱軋與冷軋，把廠裡的事講得淺顯易懂。' }
  };

  var topic = TOPIC_MAP[CATEGORY];
  document.getElementById('topic-label').textContent = topic.label;
  document.getElementById('topic-title').textContent = topic.title;
  document.getElementById('topic-name').textContent = topic.title;
  document.getElementById('topic-desc').textContent = topic.desc;
  document.title = topic.title + ' · 鋼鐵潮流 Steel Trending';

  var ALL = [];
  fetch('data/articles.json?ts=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) {
      ALL = (d.items || []).filter(function (a) { return a.category === CATEGORY; })
        .sort(function (a, b) { return (a.published || a.period) < (b.published || b.period) ? 1 : -1; });
      render('');
    })
    .catch(function () { document.getElementById('list').textContent = '文章資料暫時無法載入，請稍後再試。'; });

  document.getElementById('q').addEventListener('input', function (e) { render(e.target.value.trim()); });

  function render(q) {
    var list = document.getElementById('list'); list.textContent = '';
    var items = q ? ALL.filter(function (a) { return a.title.indexOf(q) >= 0; }) : ALL;
    document.getElementById('count').textContent = (q ? '找到 ' : '共 ') + items.length + ' 篇';
    if (!items.length) { list.appendChild(document.createElement('p')).textContent = q ? '沒有符合的文章。' : '此主題尚無文章。'; list.firstChild.className = 'flat'; return; }
    items.forEach(function (a) {
      var art = document.createElement('article'); art.className = 'article-item';
      var hd = document.createElement('div');
      var ttl = document.createElement('h3');
      var lk = document.createElement('a'); lk.href = a.url; lk.textContent = a.title;
      ttl.appendChild(lk);
      hd.appendChild(ttl);
      var meta = document.createElement('div'); meta.className = 'meta';
      if (a.published) {
        var d = document.createElement('span'); d.className = 'date'; d.textContent = a.published.slice(0, 10).replace(/-/g, '/');
        meta.appendChild(d);
      }
      if (a.summary) {
        var sm = document.createElement('span'); sm.textContent = a.summary;
        meta.appendChild(sm);
      }
      hd.appendChild(meta);
      art.appendChild(hd);
      list.appendChild(art);
    });
  }
})();
</script>
