name: tmp-photos
on:
  push:
    branches: [tmp-photos-ship]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch.py
      - run: if [ -f extra.py ]; then python3 extra.py; fi
      - run: |
          if grep -q '"render"\|"api"' queries.json; then pip install playwright && python3 -m playwright install --with-deps chromium && python3 render.py; fi
      - run: |
          git config user.name steeltrending
          git config user.email noreply@steeltrending.github.io
          git add -A out
          git commit -m "photo results" || true
          git push
