name: 更新 sitemap.xml

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "articles/**"
      - "data/articles.json"
      - tools/build_sitemap.py
      - assets/sitemap.css
      - tools/article_qr.py
      - tools/article_tts.py
      - assets/tts.js
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitemap
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 文章文末 QR Code
        run: |
          pip install -q segno pillow zxing-cpp
          python3 tools/article_qr.py
      - name: 文章語音朗讀
        run: python3 tools/article_tts.py
      - run: python3 tools/build_sitemap.py
      - name: 提交更新
        run: |
          git config user.name "steeltrending"
          git config user.email "noreply@steeltrending.github.io"
          git add sitemap.xml robots.txt articles assets/qr
          if git diff --cached --quiet; then echo "沒有變動"; exit 0; fi
          git commit -m "sitemap.xml／文章 QR 自動更新 $(TZ=Asia/Taipei date +%F)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 5
          done
          exit 1
