name: 更新關鍵字熱度

on:
  schedule:
    # 每天台北時間 06:40（UTC 22:40）
    - cron: "40 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trends
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet playwright && python -m playwright install --with-deps chromium
      - run: python3 tools/fetch_trends.py
      - name: 提交更新
        run: |
          git config user.name "steeltrending"
          git config user.email "noreply@steeltrending.github.io"
          git add data/trends.json
          if git diff --cached --quiet; then echo "沒有新資料"; exit 0; fi
          git commit -m "關鍵字熱度自動更新 $(TZ=Asia/Taipei date +%F)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 5
          done
          exit 1
