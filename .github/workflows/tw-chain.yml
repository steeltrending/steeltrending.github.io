name: 更新台股鋼鐵產業鏈

on:
  schedule:
    # 與全球鋼鐵股相同：每天台北時間 07:20、16:20、18:40（UTC 23:20、08:20、10:40）
    # 台股尚未收盤時由 tools/fetch_tw_chain.py 略過盤中資料，沿用前一交易日收盤價
    - cron: "20 23 * * *"
    - cron: "20 8 * * *"
    - cron: "40 10 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/fetch_tw_chain.py
      - .github/workflows/tw-chain.yml

permissions:
  contents: write

concurrency:
  group: tw-chain
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet yfinance
      - run: python3 tools/fetch_tw_chain.py
      - name: 提交更新
        run: |
          git config user.name "steeltrending"
          git config user.email "noreply@steeltrending.github.io"
          git add data/twchain.json data/twhistory
          if git diff --cached --quiet; then echo "沒有新資料"; exit 0; fi
          git commit -m "台股產業鏈自動更新 $(TZ=Asia/Taipei date +%F)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 5
          done
          exit 1
